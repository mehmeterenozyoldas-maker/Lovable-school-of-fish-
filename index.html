    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
      import * as xb from 'https://xrblocks.github.io/build/xrblocks.js';
      import { GoogleGenAI } from 'https://cdn.jsdelivr.net/npm/@google/genai/+esm';

      // ==========================================
      // 1. Web Audio Procedural Marine Soundscape
      // ==========================================
      class OceanAudioEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
          this.ambientGain = null;
          this.isInitialized = false;
        }

        init() {
          if (this.isInitialized) return;
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();

            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            this.masterGain.connect(this.ctx.destination);

            this.ambientGain = this.ctx.createGain();
            this.ambientGain.gain.setValueAtTime(0.08, this.ctx.currentTime);

            const osc1 = this.ctx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(55, this.ctx.currentTime);
            
            const osc2 = this.ctx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(58, this.ctx.currentTime);

            const lpf = this.ctx.createBiquadFilter();
            lpf.type = 'lowpass';
            lpf.frequency.setValueAtTime(180, this.ctx.currentTime);

            osc1.connect(lpf);
            osc2.connect(lpf);
            lpf.connect(this.ambientGain);
            this.ambientGain.connect(this.masterGain);

            osc1.start();
            osc2.start();

            this.isInitialized = true;
          } catch (e) {
            console.warn('Web Audio pending user gesture', e);
          }
        }

        updateListenerPose(pos, forward, up) {
          if (!this.isInitialized || !this.ctx || !this.ctx.listener) return;
          const l = this.ctx.listener;
          const t = this.ctx.currentTime;
          if (l.positionX) {
            l.positionX.setValueAtTime(pos.x, t);
            l.positionY.setValueAtTime(pos.y, t);
            l.positionZ.setValueAtTime(pos.z, t);
            if (forward && up) {
              l.forwardX.setValueAtTime(forward.x, t);
              l.forwardY.setValueAtTime(forward.y, t);
              l.forwardZ.setValueAtTime(forward.z, t);
              l.upX.setValueAtTime(up.x, t);
              l.upY.setValueAtTime(up.y, t);
              l.upZ.setValueAtTime(up.z, t);
            }
          } else if (l.setPosition) {
            l.setPosition(pos.x, pos.y, pos.z);
            if (forward && up) {
              l.setOrientation(forward.x, forward.y, forward.z, up.x, up.y, up.z);
            }
          }
        }

        createPanner(pos) {
          if (!this.isInitialized || !this.ctx || !pos) return this.masterGain;
          try {
            const panner = this.ctx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';
            panner.refDistance = 0.8;
            panner.maxDistance = 18;
            panner.rolloffFactor = 1.1;
            const t = this.ctx.currentTime;
            if (panner.positionX) {
              panner.positionX.setValueAtTime(pos.x, t);
              panner.positionY.setValueAtTime(pos.y, t);
              panner.positionZ.setValueAtTime(pos.z, t);
            } else if (panner.setPosition) {
              panner.setPosition(pos.x, pos.y, pos.z);
            }
            panner.connect(this.masterGain);
            return panner;
          } catch(e) {
            return this.masterGain;
          }
        }

        toggleMute() {
          if (!this.isInitialized) {
            this.init();
            return false;
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          this.muted = !this.muted;
          if (this.masterGain) {
            this.masterGain.gain.setTargetAtTime(this.muted ? 0.0 : 0.3, this.ctx.currentTime, 0.05);
          }
          return this.muted;
        }

        playBubblePop(pitchMod = 1.0, pos = null) {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            const startFreq = (350 + Math.random() * 200) * pitchMod;
            osc.frequency.setValueAtTime(startFreq, now);
            osc.frequency.exponentialRampToValueAtTime(startFreq * 2.2, now + 0.06);

            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            const dest = this.createPanner(pos);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + 0.09);
          } catch(e) {}
        }

        playFeedPellet(pos = null) {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(650, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

            const dest = this.createPanner(pos);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + 0.16);
          } catch(e) {}
        }

        playAttractTone() {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(432, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.25);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.32);
          } catch(e) {}
        }

        playScatterWhoosh(pos = null) {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

            const dest = this.createPanner(pos);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now);
            osc.stop(now + 0.42);
          } catch(e) {}
        }

        playChimeAI() {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now); // D5
            osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.18); // A5

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.36);
          } catch(e) {}
        }

        playAnchorLock() {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(329.63, now); // E4
            osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15); // E5

            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.30);
          } catch(e) {}
        }

        playTargetLockBeep() {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1174.66, now); // D6
            osc.frequency.setValueAtTime(1760.00, now + 0.04); // A6

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.13);
          } catch(e) {}
        }

        playCameraShutter() {
          if (!this.isInitialized || this.muted) return;
          try {
            const now = this.ctx.currentTime;
            // Mechanical iris click (filtered noise burst)
            const bufferSize = this.ctx.sampleRate * 0.08;
            const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = noiseBuffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2400, now);
            filter.Q.setValueAtTime(3.0, now);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);
            noise.start(now);

            // Shutter mirror recoil tone
            const osc = this.ctx.createOscillator();
            const oscGain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
            oscGain.gain.setValueAtTime(0.2, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(oscGain);
            oscGain.connect(this.masterGain);
            osc.start(now);
            osc.stop(now + 0.16);
          } catch(e) {}
        }
      }

      const audioEngine = new OceanAudioEngine();
      window.addEventListener('pointerdown', () => audioEngine.init(), { once: true });

      // ========================================================
      // 2. Naturalist Voice Narration Engine (xb-add-ai Skill)
      // ========================================================
      class NaturalistVoiceEngine {
        constructor() {
          this.enabled = true;
          this.synth = window.speechSynthesis || null;
          this.currentUtterance = null;
          this.isSpeaking = false;
        }

        speak(text) {
          if (!this.enabled || !this.synth) return;
          this.stop();

          const cleanText = text.replace(/^Dr\.\s*Marina\s*Thorne:\s*/i, '');
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.rate = 1.02;
          utterance.pitch = 1.05;

          const voices = this.synth.getVoices();
          const femaleEnVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Google')));
          if (femaleEnVoice) utterance.voice = femaleEnVoice;

          const statusDot = document.getElementById('ai-status-indicator');

          utterance.onstart = () => {
            this.isSpeaking = true;
            if (statusDot) statusDot.classList.add('ai-speaking');
          };

          utterance.onend = () => {
            this.isSpeaking = false;
            if (statusDot) statusDot.classList.remove('ai-speaking');
          };

          utterance.onerror = () => {
            this.isSpeaking = false;
            if (statusDot) statusDot.classList.remove('ai-speaking');
          };

          this.currentUtterance = utterance;
          this.synth.speak(utterance);
        }

        stop() {
          if (this.synth && this.synth.speaking) {
            this.synth.cancel();
          }
          this.isSpeaking = false;
          const statusDot = document.getElementById('ai-status-indicator');
          if (statusDot) statusDot.classList.remove('ai-speaking');
        }

        toggle() {
          this.enabled = !this.enabled;
          if (!this.enabled) this.stop();
          return this.enabled;
        }
      }

      const naturalistVoice = new NaturalistVoiceEngine();

      // ====================================================
      // 3. Multi-Species 3D Geometry (Mackerel & Coral Tang)
      // ====================================================
      function createMackerelGeometry() {
        const geo = new THREE.BufferGeometry();
        const vertices = [];
        const normals = [];
        const uvs = [];
        const indices = [];
        const aTailFactor = [];
        const aFinFactor = [];

        function addV(x, y, z, nx, ny, nz, u, v, tailWeight, finWeight) {
          vertices.push(x, y, z);
          normals.push(nx, ny, nz);
          uvs.push(u, v);
          aTailFactor.push(tailWeight);
          aFinFactor.push(finWeight);
          return (vertices.length / 3) - 1;
        }

        const rings = [
          { z:  0.18, rx: 0.007, ry: 0.007, tail: 0.0 },
          { z:  0.12, rx: 0.024, ry: 0.038, tail: 0.05 },
          { z:  0.03, rx: 0.035, ry: 0.054, tail: 0.15 },
          { z: -0.06, rx: 0.026, ry: 0.042, tail: 0.45 },
          { z: -0.15, rx: 0.010, ry: 0.016, tail: 0.80 },
        ];

        const segs = 8;
        const ringIdxs = [];
        for (let r = 0; r < rings.length; r++) {
          const ring = rings[r];
          const curr = [];
          for (let s = 0; s < segs; s++) {
            const angle = (s / segs) * Math.PI * 2;
            const x = Math.sin(angle) * ring.rx;
            const y = Math.cos(angle) * ring.ry;
            const norm = new THREE.Vector3(x, y, 0).normalize();
            const idx = addV(x, y, ring.z, norm.x, norm.y, norm.z, s / segs, r / (rings.length - 1), ring.tail, 0.0);
            curr.push(idx);
          }
          ringIdxs.push(curr);
        }

        for (let r = 0; r < rings.length - 1; r++) {
          const curr = ringIdxs[r];
          const next = ringIdxs[r + 1];
          for (let s = 0; s < segs; s++) {
            const sNext = (s + 1) % segs;
            indices.push(curr[s], next[s], next[sNext]);
            indices.push(curr[s], next[sNext], curr[sNext]);
          }
        }

        // Snout with jaw cleft
        const snout = addV(0, -0.003, 0.21, 0, 0, 1, 0.5, 0, 0.0, 0.0);
        for (let s = 0; s < segs; s++) {
          const sNext = (s + 1) % segs;
          indices.push(snout, ringIdxs[0][sNext], ringIdxs[0][s]);
        }

        // Sculpted 3D Corneal Eyes
        const eyeL = addV( 0.032, 0.012, 0.13,  1, 0.2, 0.2, 0.2, 0.2, 0.02, 0.0);
        const eyeR = addV(-0.032, 0.012, 0.13, -1, 0.2, 0.2, 0.8, 0.2, 0.02, 0.0);
        indices.push(ringIdxs[0][2], eyeL, ringIdxs[1][2]);
        indices.push(ringIdxs[0][2], ringIdxs[1][2], eyeL);
        indices.push(ringIdxs[0][6], eyeR, ringIdxs[1][6]);
        indices.push(ringIdxs[0][6], ringIdxs[1][6], eyeR);

        // Segmented Caudal Fin Rays
        const ped = ringIdxs[rings.length - 1];
        const tfTop = addV(0,  0.082, -0.27, 0, 1, 0, 1, 1, 1.0, 1.0);
        const tfMidT = addV(0, 0.035, -0.25, 0, 0.5, -0.5, 1, 0.75, 1.0, 0.9);
        const tfMid = addV(0,  0.000, -0.22, 0, 0, -1, 1, 0.5, 1.0, 0.7);
        const tfMidB = addV(0,-0.035, -0.25, 0,-0.5, -0.5, 1, 0.25, 1.0, 0.9);
        const tfBot = addV(0, -0.072, -0.27, 0, -1, 0, 1, 0, 1.0, 1.0);

        indices.push(ped[0], tfTop, tfMidT, ped[0], tfMidT, tfTop);
        indices.push(ped[0], tfMidT, tfMid, ped[0], tfMid, tfMidT);
        indices.push(ped[4], tfMid, tfMidB, ped[4], tfMidB, tfMid);
        indices.push(ped[4], tfMidB, tfBot, ped[4], tfBot, tfMidB);

        // Segmented Dorsal Fin Rays
        const dfTip1 = addV(0, 0.098, -0.01, 0, 1, 0, 0.5, 1, 0.25, 1.0);
        const dfTip2 = addV(0, 0.078, -0.06, 0, 1, 0, 0.5, 1, 0.40, 1.0);
        indices.push(ringIdxs[1][0], dfTip1, ringIdxs[2][0]);
        indices.push(ringIdxs[1][0], ringIdxs[2][0], dfTip1);
        indices.push(ringIdxs[2][0], dfTip1, dfTip2);
        indices.push(ringIdxs[2][0], dfTip2, dfTip1);
        indices.push(ringIdxs[2][0], dfTip2, ringIdxs[3][0]);
        indices.push(ringIdxs[2][0], ringIdxs[3][0], dfTip2);

        // Segmented Pectoral Fins
        const pfL1 = addV( 0.09, -0.015, 0.02,  1, 0, 0, 1, 0, 0.15, 0.85);
        const pfL2 = addV( 0.075,-0.030, -0.02, 1, 0, 0, 1, 0, 0.25, 0.95);
        indices.push(ringIdxs[2][2], pfL1, pfL2);
        indices.push(ringIdxs[2][2], pfL2, ringIdxs[3][2]);

        const pfR1 = addV(-0.09, -0.015, 0.02, -1, 0, 0, 0, 0, 0.15, 0.85);
        const pfR2 = addV(-0.075,-0.030, -0.02,-1, 0, 0, 0, 0, 0.25, 0.95);
        indices.push(ringIdxs[2][6], pfR2, pfR1);
        indices.push(ringIdxs[2][6], ringIdxs[3][6], pfR2);

        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setAttribute('aTailFactor', new THREE.Float32BufferAttribute(aTailFactor, 1));
        geo.setAttribute('aFinFactor', new THREE.Float32BufferAttribute(aFinFactor, 1));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      function createCoralTangGeometry() {
        const geo = new THREE.BufferGeometry();
        const vertices = [];
        const normals = [];
        const uvs = [];
        const indices = [];
        const aTailFactor = [];
        const aFinFactor = [];

        function addV(x, y, z, nx, ny, nz, u, v, tailWeight, finWeight) {
          vertices.push(x, y, z);
          normals.push(nx, ny, nz);
          uvs.push(u, v);
          aTailFactor.push(tailWeight);
          aFinFactor.push(finWeight);
          return (vertices.length / 3) - 1;
        }

        const rings = [
          { z:  0.15, rx: 0.006, ry: 0.009, tail: 0.0 },
          { z:  0.09, rx: 0.020, ry: 0.052, tail: 0.05 },
          { z:  0.00, rx: 0.027, ry: 0.088, tail: 0.20 },
          { z: -0.07, rx: 0.020, ry: 0.066, tail: 0.50 },
          { z: -0.14, rx: 0.009, ry: 0.022, tail: 0.85 },
        ];

        const segs = 8;
        const ringIdxs = [];
        for (let r = 0; r < rings.length; r++) {
          const ring = rings[r];
          const curr = [];
          for (let s = 0; s < segs; s++) {
            const angle = (s / segs) * Math.PI * 2;
            const x = Math.sin(angle) * ring.rx;
            const y = Math.cos(angle) * ring.ry;
            const norm = new THREE.Vector3(x, y, 0).normalize();
            const idx = addV(x, y, ring.z, norm.x, norm.y, norm.z, s / segs, r / (rings.length - 1), ring.tail, 0.0);
            curr.push(idx);
          }
          ringIdxs.push(curr);
        }

        for (let r = 0; r < rings.length - 1; r++) {
          const curr = ringIdxs[r];
          const next = ringIdxs[r + 1];
          for (let s = 0; s < segs; s++) {
            const sNext = (s + 1) % segs;
            indices.push(curr[s], next[s], next[sNext]);
            indices.push(curr[s], next[sNext], curr[sNext]);
          }
        }

        // Snout with high cranial ridge
        const snout = addV(0, -0.012, 0.18, 0, 0, 1, 0.5, 0, 0.0, 0.0);
        for (let s = 0; s < segs; s++) {
          const sNext = (s + 1) % segs;
          indices.push(snout, ringIdxs[0][sNext], ringIdxs[0][s]);
        }

        // Tang 3D Corneal Eyes
        const eyeL = addV( 0.026, 0.022, 0.10,  1, 0.3, 0.1, 0.2, 0.2, 0.03, 0.0);
        const eyeR = addV(-0.026, 0.022, 0.10, -1, 0.3, 0.1, 0.8, 0.2, 0.03, 0.0);
        indices.push(ringIdxs[0][2], eyeL, ringIdxs[1][2]);
        indices.push(ringIdxs[0][2], ringIdxs[1][2], eyeL);
        indices.push(ringIdxs[0][6], eyeR, ringIdxs[1][6]);
        indices.push(ringIdxs[0][6], ringIdxs[1][6], eyeR);

        // Segmented Caudal Fin
        const ped = ringIdxs[rings.length - 1];
        const tfTop = addV(0,  0.075, -0.23, 0, 1, 0, 1, 1, 1.0, 1.0);
        const tfMidT = addV(0, 0.030, -0.25, 0, 0.5, -0.5, 1, 0.75, 1.0, 0.9);
        const tfMid = addV(0,  0.000, -0.25, 0, 0,-1, 1, 0.5, 1.0, 0.8);
        const tfMidB = addV(0,-0.030, -0.25, 0,-0.5, -0.5, 1, 0.25, 1.0, 0.9);
        const tfBot = addV(0, -0.075, -0.23, 0,-1, 0, 1, 0, 1.0, 1.0);

        indices.push(ped[0], tfTop, tfMidT, ped[0], tfMidT, tfTop);
        indices.push(ped[0], tfMidT, tfMid, ped[0], tfMid, tfMidT);
        indices.push(ped[4], tfMid, tfMidB, ped[4], tfMidB, tfMid);
        indices.push(ped[4], tfMidB, tfBot, ped[4], tfBot, tfMidB);

        // High Dorsal Crest Rays
        const crest1 = addV(0, 0.138,  0.02, 0, 1, 0, 0.5, 1, 0.2, 1.0);
        const crest2 = addV(0, 0.124, -0.05, 0, 1, 0, 0.5, 1, 0.4, 1.0);
        indices.push(ringIdxs[1][0], crest1, ringIdxs[2][0]);
        indices.push(ringIdxs[1][0], ringIdxs[2][0], crest1);
        indices.push(ringIdxs[2][0], crest1, crest2);
        indices.push(ringIdxs[2][0], crest2, crest1);
        indices.push(ringIdxs[2][0], crest2, ringIdxs[3][0]);
        indices.push(ringIdxs[2][0], ringIdxs[3][0], crest2);

        // Ventral Anal Spine
        const spineV = addV(0, -0.128, 0.00, 0, -1, 0, 0.5, 0, 0.2, 1.0);
        indices.push(ringIdxs[2][4], spineV, ringIdxs[3][4]);
        indices.push(ringIdxs[2][4], ringIdxs[3][4], spineV);

        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
        geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(normals), 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
        geo.setAttribute('aTailFactor', new THREE.BufferAttribute(new Float32Array(aTailFactor), 1));
        geo.setAttribute('aFinFactor', new THREE.BufferAttribute(new Float32Array(aFinFactor), 1));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      // ==========================================
      // 4. PBR Iridescent Scale Shader Material
      // ==========================================
      function createPbrIridescentFishMaterial(speciesType = 0.0) {
        const material = new THREE.MeshStandardMaterial({
          roughness: 0.24,
          metalness: 0.38,
          side: THREE.DoubleSide
        });

        material.userData.shader = null;
        material.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = { value: 0 };
          shader.uniforms.uCausticsStrength = { value: 0.45 };
          shader.uniforms.uBiolumGlow = { value: 0.0 };
          shader.uniforms.uSpeciesType = { value: speciesType };

          shader.vertexShader = `
            uniform float uTime;
            attribute float aTailFactor;
            attribute float aFinFactor;
            attribute float aInstanceSpeed;
            attribute float aInstancePhase;
            varying vec2 vFishUv;
            varying float vFinWeight;
          ` + shader.vertexShader;

          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `
            #include <begin_vertex>
            vFishUv = uv;
            vFinWeight = aFinFactor;
            float swimFreq = 8.5 + aInstanceSpeed * 5.0;
            float wave1 = sin(uTime * swimFreq + aInstancePhase + position.z * 16.0) * (aTailFactor * 0.042);
            float wave2 = sin(uTime * swimFreq * 1.8 + aInstancePhase + position.z * 22.0) * (pow(aTailFactor, 2.0) * 0.016);
            float finFlutter = sin(uTime * 26.0 + aInstancePhase) * (aFinFactor * 0.015);
            transformed.x += wave1 + wave2 + finFlutter;
            `
          );

          shader.fragmentShader = `
            uniform float uTime;
            uniform float uCausticsStrength;
            uniform float uBiolumGlow;
            uniform float uSpeciesType;
            varying vec2 vFishUv;
            varying float vFinWeight;
          ` + shader.fragmentShader;

          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            `
            #include <dithering_fragment>
            vec3 vDir = normalize(vViewPosition);

            // Procedural Micro-Scale Rhomboid Ctenoid Bump
            vec2 scUv = vFishUv * vec2(55.0, 18.0);
            float bump = sin(scUv.x + scUv.y) * cos(scUv.x - scUv.y) * 0.32;
            vec3 microNormal = normalize(vNormal + vec3(bump * 0.12 * (1.0 - vFinWeight), bump * 0.12 * (1.0 - vFinWeight), 0.0));

            float NdotV = max(dot(microNormal, vDir), 0.0);
            float fresnel = pow(1.0 - NdotV, 2.5);

            vec3 spectralColor = 0.5 + 0.5 * cos(6.28318 * (fresnel * 1.7 + vec3(0.0, 0.33, 0.67)));
            gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * spectralColor * 1.6, 0.42);

            // Subsurface Scattering (SSS) Fin Translucency
            if (vFinWeight > 0.15) {
              vec3 sunDir = normalize(vec3(0.2, 0.85, 0.3));
              float sss = pow(clamp(dot(-vDir, sunDir), 0.0, 1.0), 2.8) * vFinWeight;
              vec3 sssTint = (uSpeciesType < 0.5) ? vec3(0.4, 0.9, 1.0) : vec3(1.0, 0.75, 0.25);
              gl_FragColor.rgb += sssTint * sss * 0.75;
            }

            // Animated Refracted Water Caustics
            vec3 vPos = vViewPosition;
            float c1 = sin(vPos.x * 4.2 + uTime * 1.5) * cos(vPos.z * 4.2 + uTime * 1.2);
            float c2 = cos(vPos.x * 6.8 - uTime * 2.0) * sin(vPos.z * 5.5 + uTime * 1.6);
            float caustic = clamp((c1 + c2) * 0.5 + 0.35, 0.0, 1.0);
            gl_FragColor.rgb += vec3(0.25, 0.85, 1.0) * caustic * uCausticsStrength;

            // Bioluminescent Glow
            if (uBiolumGlow > 0.01) {
              vec3 bioGlow = (uSpeciesType < 0.5) ? vec3(0.0, 0.95, 0.85) : vec3(1.0, 0.6, 0.1);
              gl_FragColor.rgb += bioGlow * uBiolumGlow * 0.6;
            }
            `
          );

          material.userData.shader = shader;
        };

        return material;
      }

      // 5B. Real-Time Voice Speech-to-Text (STT) Microphone Engine
      // ========================================================
      class NaturalistSpeechInput {
        constructor() {
          this.isListening = false;
          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRec) {
            this.rec = new SpeechRec();
            this.rec.continuous = false;
            this.rec.interimResults = false;
            this.rec.lang = 'en-US';

            this.rec.onresult = (e) => {
              if (e.results && e.results[0] && e.results[0][0]) {
                const transcript = e.results[0][0].transcript;
                const tip = document.getElementById('hud-xr-tip');
                if (tip) tip.textContent = `🎤 Heard: "${transcript}"`;
                window.askNaturalist(transcript);
              }
            };
            this.rec.onstart = () => {
              this.isListening = true;
              this.updateUI(true);
            };
            this.rec.onend = () => {
              this.isListening = false;
              this.updateUI(false);
            };
            this.rec.onerror = (err) => {
              console.warn('Speech recognition error:', err);
              this.isListening = false;
              this.updateUI(false);
            };
          } else {
            this.rec = null;
          }
        }

        toggle() {
          if (!this.rec) {
            const tip = document.getElementById('hud-xr-tip');
            if (tip) tip.textContent = 'Voice input not supported in this browser; click quick prompts!';
            return false;
          }
          if (this.isListening) {
            this.rec.stop();
            this.isListening = false;
            this.updateUI(false);
          } else {
            try {
              this.rec.start();
              this.isListening = true;
              this.updateUI(true);
            } catch(e) {
              console.warn(e);
            }
          }
          return this.isListening;
        }

        updateUI(active) {
          const btn = document.getElementById('btn-mic-toggle');
          if (btn) {
            btn.classList.toggle('active', active);
            btn.style.color = active ? '#ef4444' : '#38bdf8';
            btn.style.borderColor = active ? 'rgba(239, 68, 68, 0.7)' : 'rgba(56, 189, 248, 0.45)';
          }
          const tip = document.getElementById('hud-xr-tip');
          if (tip && active) {
            tip.textContent = '🎤 Listening... Ask Dr. Marina Thorne your marine question!';
          }
        }
      }

          });

          });

          const coralGoldMat = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            roughness: 0.5,
            metalness: 0.1
          });

          // Table Reef A: Left Table at (-1.7, -0.55, -1.8)
          const tableA = new THREE.Group();
          tableA.position.set(-1.7, -0.55, -1.8);

          const slabA = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 0.08, 16), reefMatSand);
          tableA.add(slabA);

          for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const dist = 0.25 + Math.random() * 0.25;
            const h = 0.15 + Math.random() * 0.2;
            const cMesh = new THREE.Mesh(new THREE.ConeGeometry(0.08, h, 8), (i % 2 === 0) ? coralCyanMat : coralCoralMat);
            cMesh.position.set(Math.cos(angle) * dist, h * 0.5, Math.sin(angle) * dist);
            cMesh.rotation.z = (Math.random() - 0.5) * 0.3;
            tableA.add(cMesh);
          }

          // Wavy kelp stalks
          for (let k = 0; k < 4; k++) {
            const stalk = new THREE.Mesh(
              new THREE.CylinderGeometry(0.015, 0.02, 0.7, 8),
              new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.5 })
            );
            stalk.position.set((Math.random() - 0.5) * 0.5, 0.35, (Math.random() - 0.5) * 0.5);
            tableA.add(stalk);
            this.kelpFronds.push(stalk);
          }

          this.add(tableA);

          // Table Reef B: Right Table at (1.7, -0.55, -1.8)
          const tableB = new THREE.Group();
          tableB.position.set(1.7, -0.55, -1.8);

          const slabB = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 0.08, 16), reefMatSand);
          tableB.add(slabB);

          for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const dist = 0.25 + Math.random() * 0.25;
            const h = 0.16 + Math.random() * 0.18;
            const cMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.12), (i % 2 === 0) ? coralGoldMat : coralCoralMat);
            cMesh.position.set(Math.cos(angle) * dist, 0.1, Math.sin(angle) * dist);
            cMesh.scale.set(1.0, 1.4, 1.0);
            tableB.add(cMesh);
          }

          for (let k = 0; k < 4; k++) {
            const stalk = new THREE.Mesh(
              new THREE.CylinderGeometry(0.015, 0.02, 0.7, 8),
              new THREE.MeshStandardMaterial({ color: 0x059669, roughness: 0.5 })
            );
            stalk.position.set((Math.random() - 0.5) * 0.5, 0.35, (Math.random() - 0.5) * 0.5);
            tableB.add(stalk);
            this.kelpFronds.push(stalk);
          }

          this.add(tableB);

          this.tableCentres = [
            new THREE.Vector3(-1.7, -0.55, -1.8),
            new THREE.Vector3(1.7, -0.55, -1.8)
          ];
        }

        update(t) {
          for (let i = 0; i < this.kelpFronds.length; i++) {
            this.kelpFronds[i].rotation.z = Math.sin(t * 1.6 + i) * 0.18;
            this.kelpFronds[i].rotation.x = Math.cos(t * 1.3 + i) * 0.14;
          }
        }
      }

          this.body = new THREE.Group();
          const torsoGeo = new THREE.ConeGeometry(0.24, 1.4, 12);
          torsoGeo.rotateX(Math.PI / 2);
          const torso = new THREE.Mesh(torsoGeo, skinMat);
          torso.scale.set(0.85, 1.0, 1.0);
          this.body.add(torso);

          // Snout / Head
          const headGeo = new THREE.ConeGeometry(0.21, 0.65, 12);
          headGeo.rotateX(-Math.PI / 2);
          const head = new THREE.Mesh(headGeo, skinMat);
          head.position.set(0, -0.02, 0.95);
          head.scale.set(0.85, 0.85, 1.0);
          this.body.add(head);

          // Dorsal fin with black tip
          const dorsalGeo = new THREE.BufferGeometry();
          const dVerts = new Float32Array([
            0, 0, 0.2,
            0, 0.42, -0.15,
            0, 0, -0.3
          ]);
          dorsalGeo.setAttribute('position', new THREE.BufferAttribute(dVerts, 3));
          dorsalGeo.computeVertexNormals();
          const dorsalFin = new THREE.Mesh(dorsalGeo, tipMat);
          dorsalFin.position.set(0, 0.15, 0.1);
          this.body.add(dorsalFin);

          // Pectoral fins
          const pectL = new THREE.Mesh(dorsalGeo, skinMat);
          pectL.rotation.set(0, 0, -Math.PI / 2.6);
          pectL.scale.set(1, 0.9, 0.9);
          pectL.position.set(0.2, -0.08, 0.4);
          this.body.add(pectL);

          const pectR = new THREE.Mesh(dorsalGeo, skinMat);
          pectR.rotation.set(0, 0, Math.PI / 2.6);
          pectR.scale.set(1, 0.9, 0.9);
          pectR.position.set(-0.2, -0.08, 0.4);
          this.body.add(pectR);

          // Articulated caudal tail
          this.tailGroup = new THREE.Group();
          this.tailGroup.position.set(0, 0, -0.7);

          const tailPeduncle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.18, 0.7, 8), skinMat);
          tailPeduncle.rotateX(Math.PI / 2);
          tailPeduncle.position.set(0, 0, -0.35);
          this.tailGroup.add(tailPeduncle);

          const caudalGeo = new THREE.BufferGeometry();
          const cVerts = new Float32Array([
            0, 0, 0,
            0, 0.45, -0.4,
            0, -0.28, -0.32
          ]);
          caudalGeo.setAttribute('position', new THREE.BufferAttribute(cVerts, 3));
          caudalGeo.computeVertexNormals();
          const caudalFin = new THREE.Mesh(caudalGeo, tipMat);
          caudalFin.position.set(0, 0, -0.7);
          this.tailGroup.add(caudalFin);

          this.body.add(this.tailGroup);
          this.add(this.body);

          this.position.set(0, 0.2, -3.5);
        }

        update(t, dt) {
          // Patrol spline around room boundaries & reef
          const orbitR = 3.2;
          const px = Math.cos(t * 0.35) * orbitR;
          const pz = Math.sin(t * 0.35) * (orbitR * 0.8) - 1.2;
          const py = -0.3 + Math.sin(t * 0.5) * 0.45;

          const nextPos = new THREE.Vector3(px, py, pz);
          this.velocity.copy(nextPos).sub(this.position).divideScalar(dt || 0.016);
          this.position.copy(nextPos);

          if (this.velocity.lengthSq() > 0.001) {
            const dir = this.velocity.clone().normalize();
            this.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
          }

          // Undulate tail fin in sync with swim velocity
          if (this.tailGroup) {
            const speed = Math.max(1.0, this.velocity.length());
            this.tailGroup.rotation.y = Math.sin(t * speed * 4.2) * 0.42;
          }

          // Compute world head position for Boids evasion
          this.headPos.copy(this.position).add(new THREE.Vector3(0, 0, 1.2).applyQuaternion(this.quaternion));
        }
      }

      // ========================================================
      // 6C. Volumetric Light Shafts (God Rays)
      // ========================================================
      class VolumetricLightShafts extends THREE.Group {
        constructor() {
          super();
          this.rays = [];
          this.buildLightCones();
        }

        buildLightCones() {
          const rayMat = new THREE.MeshBasicMaterial({
            color: 0x93c5fd,
            transparent: true,
            opacity: 0.16,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
          });

          const rayGeo = new THREE.CylinderGeometry(0.12, 1.8, 6.0, 16, 1, true);
          rayGeo.translate(0, -3.0, 0);

          const positions = [
            [-1.2, 3.8, -2.0, 0.15, 0.1],
            [ 1.4, 3.9, -1.8, -0.12, 0.08],
            [ 0.0, 4.0, -3.2, 0.05, -0.15]
          ];

          for (const [x, y, z, rx, rz] of positions) {
            const ray = new THREE.Mesh(rayGeo, rayMat);
            ray.position.set(x, y, z);
            ray.rotation.x = rx;
            ray.rotation.z = rz;
            this.add(ray);
            this.rays.push({ mesh: ray, baseOpacity: 0.15 });
          }
        }

        setBrightness(mult) {
          for (const r of this.rays) {
            r.mesh.material.opacity = r.baseOpacity * mult;
            r.mesh.visible = (mult > 0.02);
          }
        }

        update(t) {
          for (let i = 0; i < this.rays.length; i++) {
            const r = this.rays[i];
            r.mesh.rotation.y = t * 0.05 + i;
          }
        }
      }

      // ========================================================
      // 6E. Undulating Water Surface Ceiling (3D Realism)
      // ========================================================
      class WaterSurfaceCeiling extends THREE.Group {
        constructor() {
          super();
          const wGeo = new THREE.PlaneGeometry(32, 32, 28, 28);
          wGeo.rotateX(Math.PI / 2); // Facing downward into the ocean column
          this.wGeo = wGeo;
          this.origY = new Float32Array(wGeo.attributes.position.count);
          const pos = wGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            this.origY[i] = pos.getY(i);
          }

          const wMat = new THREE.MeshStandardMaterial({
            color: 0x38bdf8,
            roughness: 0.12,
            metalness: 0.65,
            transparent: true,
            opacity: 0.58,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
          });

          this.mesh = new THREE.Mesh(wGeo, wMat);
          this.mesh.position.set(0, 2.45, -1.5);
          this.add(this.mesh);
        }

        update(t) {
          const pos = this.wGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const z = pos.getZ(i);
            const wave = Math.sin(x * 0.9 + t * 1.8) * 0.07 + Math.cos(z * 0.7 + t * 1.4) * 0.05;
            pos.setY(i, this.origY[i] + wave);
          }
          pos.needsUpdate = true;
          this.wGeo.computeVertexNormals();
        }
      }

      // ========================================================
      // 6F. Marine Snow (Micro-Plankton & Organic Detritus)
      // ========================================================
      class MarineSnowSystem extends THREE.Group {
        constructor(count = 1200) {
          super();
          this.count = count;
          const geo = new THREE.BufferGeometry();
          this.positions = new Float32Array(count * 3);
          this.velocities = new Float32Array(count * 3);

          for (let i = 0; i < count; i++) {
            this.positions[i * 3 + 0] = (Math.random() - 0.5) * 16.0;
            this.positions[i * 3 + 1] = -2.5 + Math.random() * 4.9;
            this.positions[i * 3 + 2] = -1.5 + (Math.random() - 0.5) * 16.0;

            this.velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.02;
            this.velocities[i * 3 + 1] = -0.03 - Math.random() * 0.04; // Gentle sedimentation
            this.velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;
          }

          geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));

          const mat = new THREE.PointsMaterial({
            color: 0xe0f2fe,
            size: 0.035,
            transparent: true,
            opacity: 0.65,
            blending: THREE.AdditiveBlending
          });

          this.points = new THREE.Points(geo, mat);
          this.add(this.points);
        }

        update(t, dt) {
          const pos = this.points.geometry.attributes.position;
          for (let i = 0; i < this.count; i++) {
            const i3 = i * 3;
            let px = pos.getX(i);
            let py = pos.getY(i);
            let pz = pos.getZ(i);

            // Brownian ocean swell
            px += Math.sin(t * 0.8 + i) * 0.002 + this.velocities[i3 + 0];
            py += this.velocities[i3 + 1] * dt * 0.7;
            pz += Math.cos(t * 0.7 + i) * 0.002 + this.velocities[i3 + 2];

            if (py < -2.6) {
              py = 2.3;
              px = (Math.random() - 0.5) * 14.0;
              pz = -1.5 + (Math.random() - 0.5) * 14.0;
            }

            pos.setXYZ(i, px, py, pz);
          }
          pos.needsUpdate = true;
        }
      }

      // ========================================================
      // 6G. Spatial Underwater Research Specimen Viewfinder
      // ========================================================
      class SpecimenViewfinder extends THREE.Group {
        constructor() {
          super();
          this.visible = false;
          this.lockedTarget = null;
          this.lastLockedName = null;

          // 1. Four Targeting Corner Brackets (LineSegments)
          const bracketGeo = new THREE.BufferGeometry();
          const d = 0.16;
          const arm = 0.045;
          const verts = [
            // Top Left
            -d, d - arm, 0,  -d, d, 0,
            -d, d, 0,        -d + arm, d, 0,
            // Top Right
             d - arm, d, 0,   d, d, 0,
             d, d, 0,         d, d - arm, 0,
            // Bottom Right
             d, -d + arm, 0,  d, -d, 0,
             d, -d, 0,        d - arm, -d, 0,
            // Bottom Left
            -d + arm, -d, 0, -d, -d, 0,
            -d, -d, 0,       -d, -d + arm, 0,
          ];
          bracketGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));

          this.bracketMat = new THREE.LineBasicMaterial({
            color: 0x38bdf8,
            linewidth: 2,
            transparent: true,
            opacity: 0.95,
            depthTest: false
          });
          this.bracketMesh = new THREE.LineSegments(bracketGeo, this.bracketMat);
          this.add(this.bracketMesh);

          // Center crosshair pip
          const pipGeo = new THREE.RingGeometry(0.004, 0.008, 16);
          const pipMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, depthTest: false });
          this.pipMesh = new THREE.Mesh(pipGeo, pipMat);
          this.add(this.pipMesh);

          // 2. Dynamic Specimen Telemetry Label (Canvas Sprite)
          this.canvas = document.createElement('canvas');
          this.canvas.width = 512;
          this.canvas.height = 192;
          this.ctx = this.canvas.getContext('2d');

          this.texture = new THREE.CanvasTexture(this.canvas);
          this.texture.minFilter = THREE.LinearFilter;
          const spriteMat = new THREE.SpriteMaterial({ map: this.texture, transparent: true, depthTest: false });
          this.sprite = new THREE.Sprite(spriteMat);
          this.sprite.scale.set(0.38, 0.14, 1);
          this.sprite.position.set(0, 0.18, 0);
          this.add(this.sprite);

          this.renderTelemetryCanvas({
            name: 'SCANNING OCEAN...',
            family: 'Targeting...',
            length: '--',
            health: '--',
            speed: '--'
          });
        }

        renderTelemetryCanvas(data) {
          const ctx = this.ctx;
          ctx.clearRect(0, 0, 512, 192);

          // High-tech translucent rounded badge
          ctx.fillStyle = 'rgba(7, 18, 38, 0.88)';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.roundRect(8, 8, 496, 176, 16);
          ctx.fill();
          ctx.stroke();

          // Header: Specimen Common Name
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 30px system-ui, sans-serif';
          ctx.fillText(data.name || 'UNKNOWN SPECIMEN', 26, 48);

          // Subtitle: Scientific Taxonomy
          ctx.fillStyle = '#93c5fd';
          ctx.font = 'italic 20px system-ui, sans-serif';
          ctx.fillText(data.family || 'Marine Fauna', 26, 80);

          // Divider rule
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(26, 96);
          ctx.lineTo(486, 96);
          ctx.stroke();

          // Biometrics Row: Length, Health, Speed
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 22px system-ui, monospace';
          ctx.fillText(`LEN: ${data.length}`, 26, 134);
          ctx.fillText(`HLTH: ${data.health}`, 190, 134);
          ctx.fillText(`SPD: ${data.speed}`, 350, 134);

          // Status dot
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.arc(470, 42, 8, 0, Math.PI * 2);
          ctx.fill();

          this.texture.needsUpdate = true;
        }

        lockTarget(target) {
          this.visible = true;
          this.lockedTarget = target;

          if (target.name !== this.lastLockedName) {
            this.lastLockedName = target.name;
            audioEngine.playTargetLockBeep();
            this.bracketMat.color.setHex(0x22c55e); // Green lock
          }

          this.renderTelemetryCanvas(target);
          this.position.copy(target.pos);

          if (target.scale) {
            const sc = Math.max(0.6, Math.min(2.5, target.scale));
            this.bracketMesh.scale.setScalar(sc);
          }
        }

        clearTarget() {
          this.visible = false;
          this.lockedTarget = null;
          this.lastLockedName = null;
          this.bracketMat.color.setHex(0x38bdf8);
        }

        updatePose(camPos, camQuat) {
          if (!this.visible) return;
          this.quaternion.copy(camQuat);
        }
      }

        init() {
          this.setupLighting();
          this.setupEnvironment();
          this.setupTabletopReefs();
          this.setupDepthOcclusionGeometry();
          this.setupMultiSpeciesFish();
          this.setupSpatialPhysicsCard();
          this.setupSpatialNaturalistCard();
          this.setupSpatialJournalCard();

        dispose() {
          window.removeEventListener('pointerdown', this.onPointerDown);
          if (this.meshMackerel) {
            this.remove(this.meshMackerel);
            this.meshMackerel.geometry.dispose();
            this.meshMackerel.material.dispose();
          }
          if (this.meshTang) {
            this.remove(this.meshTang);
            this.meshTang.geometry.dispose();
            this.meshTang.material.dispose();
          }
          if (this.shark) this.remove(this.shark);
          if (this.godRays) this.remove(this.godRays);
          if (this.flashlight) this.remove(this.flashlight);
          if (this.viewfinder) this.remove(this.viewfinder);
          if (this.waterSurface) this.remove(this.waterSurface);
          if (this.marineSnow) this.remove(this.marineSnow);
          if (this.spatialPhysicsCard) this.remove(this.spatialPhysicsCard);
          if (this.spatialNaturalistCard) this.remove(this.spatialNaturalistCard);
          if (this.spatialJournalCard) this.remove(this.spatialJournalCard);
        }

        setupLighting() {
          this.ambientLight = new THREE.AmbientLight(0x0a3c5a, 2.0);
          this.add(this.ambientLight);

          this.sunLight = new THREE.DirectionalLight(0xbde8ff, 3.5);
          this.sunLight.position.set(2, 10, 3);
          this.add(this.sunLight);
        }

        setupEnvironment() {
          const floorGeo = new THREE.PlaneGeometry(35, 35, 36, 36);
          floorGeo.rotateX(-Math.PI / 2);
          const pos = floorGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const z = pos.getZ(i);
            pos.setY(i, Math.sin(x * 0.4) * 0.4 + Math.cos(z * 0.4) * 0.4 - 2.8);
          }
          floorGeo.computeVertexNormals();

          this.seabedMat = new THREE.MeshStandardMaterial({
            color: 0x1b3b55,
            roughness: 0.85,
            metalness: 0.1
          });
          this.seabed = new THREE.Mesh(floorGeo, this.seabedMat);
          this.add(this.seabed);

          const bCount = 600;
          const bGeo = new THREE.BufferGeometry();
          const bPos = new Float32Array(bCount * 3);
          for (let i = 0; i < bCount; i++) {
            bPos[i * 3 + 0] = (Math.random() - 0.5) * 20;
            bPos[i * 3 + 1] = -2.5 + Math.random() * 5.0;
            bPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
          }
          bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
          const bMat = new THREE.PointsMaterial({
            color: 0xa5f3fc,
            size: 0.08,
            transparent: true,
            opacity: 0.7,

        // ========================================================
        // Depth Occlusion Barrier Mesh (xb-add-world-sensing)
        // ========================================================
        setupDepthOcclusionGeometry() {
          // Creates a depth-writing occlusion barrier so fish swimming behind
          // physical room obstacles are occluded naturally
          const occMat = new THREE.MeshBasicMaterial({
            colorWrite: false, // Transparent to color, writes only to depth buffer
            depthWrite: true
          });

          // Simulated tabletop occlusion surfaces matching room desks
          const deskOccA = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.1, 0.9), occMat);
          deskOccA.position.set(-1.7, -0.6, -1.8);
          this.add(deskOccA);

          const deskOccB = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.1, 0.9), occMat);
          deskOccB.position.set(1.7, -0.6, -1.8);
          this.add(deskOccB);
        }

        setupTabletopReefs() {
          this.tabletopReefs = new TabletopReefSystem();
          this.add(this.tabletopReefs);
        }

        setupMultiSpeciesFish() {
          const mackerelGeo = createMackerelGeometry();
          this.matMackerel = createPbrIridescentFishMaterial(0.0);
          this.meshMackerel = new THREE.InstancedMesh(mackerelGeo, this.matMackerel, this.mackerelCount);
          this.meshMackerel.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

          const tangGeo = createCoralTangGeometry();
          this.matTang = createPbrIridescentFishMaterial(1.0);
          this.meshTang = new THREE.InstancedMesh(tangGeo, this.matTang, this.tangCount);
          this.meshTang.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

          const speedsM = new Float32Array(this.mackerelCount);
          const phasesM = new Float32Array(this.mackerelCount);
          const speedsT = new Float32Array(this.tangCount);
          const phasesT = new Float32Array(this.tangCount);

          const mackerelColors = [new THREE.Color(0x00f0ff), new THREE.Color(0x0284c7), new THREE.Color(0x38bdf8)];
          const tangColors = [new THREE.Color(0xffaa00), new THREE.Color(0xfbbf24), new THREE.Color(0xf43f5e)];

          for (let i = 0; i < this.maxFish; i++) {
            const isMackerel = i < this.mackerelCount;
            const subIdx = isMackerel ? i : i - this.mackerelCount;

            const px = (Math.random() - 0.5) * 6.0;
            const py = -0.5 + (Math.random() - 0.5) * 1.8;
            const pz = -1.8 + (Math.random() - 0.5) * 5.0;

            this.positions[i * 3 + 0] = px;
            this.positions[i * 3 + 1] = py;
            this.positions[i * 3 + 2] = pz;

            this.velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.8;
            this.velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.2;
            this.velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.8;

            const spd = isMackerel ? (1.0 + Math.random() * 0.5) : (0.75 + Math.random() * 0.4);
            const ph = Math.random() * Math.PI * 2;
            const sc = isMackerel ? (0.8 + Math.random() * 0.4) : (0.75 + Math.random() * 0.35);

            this.speeds[i] = spd;
            this.phases[i] = ph;
            this.scales[i] = sc;

            this.dummy.position.set(px, py, pz);
            this.dummy.scale.setScalar(sc);
            this.dummy.updateMatrix();

            if (isMackerel) {
              speedsM[subIdx] = spd;
              phasesM[subIdx] = ph;
              const c = mackerelColors[subIdx % mackerelColors.length].clone();
              this.meshMackerel.setColorAt(subIdx, c);
              this.meshMackerel.setMatrixAt(subIdx, this.dummy.matrix);
            } else {
              speedsT[subIdx] = spd;
              phasesT[subIdx] = ph;
              const c = tangColors[subIdx % tangColors.length].clone();
              this.meshTang.setColorAt(subIdx, c);
              this.meshTang.setMatrixAt(subIdx, this.dummy.matrix);
            }
          }

          mackerelGeo.setAttribute('aInstanceSpeed', new THREE.InstancedBufferAttribute(speedsM, 1));
          mackerelGeo.setAttribute('aInstancePhase', new THREE.InstancedBufferAttribute(phasesM, 1));
          tangGeo.setAttribute('aInstanceSpeed', new THREE.InstancedBufferAttribute(speedsT, 1));
          tangGeo.setAttribute('aInstancePhase', new THREE.InstancedBufferAttribute(phasesT, 1));

          this.meshMackerel.instanceMatrix.needsUpdate = true;
          this.meshTang.instanceMatrix.needsUpdate = true;
          if (this.meshMackerel.instanceColor) this.meshMackerel.instanceColor.needsUpdate = true;
          if (this.meshTang.instanceColor) this.meshTang.instanceColor.needsUpdate = true;

          this.add(this.meshMackerel);
          this.add(this.meshTang);
        }

        captureSpecimenSnapshot() {
          audioEngine.playCameraShutter();

          const flash = document.getElementById('camera-flash-overlay');
          if (flash) {
            flash.style.opacity = '0.85';
            setTimeout(() => { flash.style.opacity = '0'; }, 120);
          }

          const target = this.viewfinder ? this.viewfinder.lockedTarget : null;
          let entry;

          if (target && target.name) {
            entry = {
              name: target.name,
              family: target.family,
              length: target.length,
              health: target.health,
              speed: target.speed,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };

            const existingIdx = this.journalEntries.findIndex(e => e.name === target.name);
            if (existingIdx >= 0) {
              this.journalEntries[existingIdx] = entry;
            } else {
              this.journalEntries.push(entry);
            }

            if (target.name.includes('SHARK')) {
              naturalistVoice.speak("Dr. Marina Thorne: Outstanding capture! Blacktip Reef Shark logged into the field journal. Notice its rapid caudal thrust and hydrodynamic dorsal fin tips.");
            } else if (target.name.includes('MACKEREL')) {
              naturalistVoice.speak("Dr. Marina Thorne: Excellent focus! Atlantic Mackerel cataloged. Its fusiform body geometry and ctenoid scale iridescence are clearly visible.");
            } else if (target.name.includes('TANG')) {
              naturalistVoice.speak("Dr. Marina Thorne: Great shot! Yellowtail Coral Tang recorded. A critical herbivore maintaining the balance of our tabletop coral reefs.");
            } else if (target.name.includes('CORAL')) {
              naturalistVoice.speak("Dr. Marina Thorne: Specimen confirmed: Acropora coral reef colony showing high polyp vitality and organic growth architecture.");
            }
          } else {
            entry = {
              name: 'Ocean Water Column Survey',
              family: 'Marine Plankton & Caustics',
              length: 'N/A',
              health: '100%',
              speed: '0.2 m/s',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };
            if (!this.journalEntries.some(e => e.name === entry.name)) {
              this.journalEntries.push(entry);
            }
            naturalistVoice.speak("Dr. Marina Thorne: Ambient pelagic survey captured. Suspended marine snow detritus and surface wave refractions logged.");
          }

          if (this.journalSubHeader && this.journalListText) {
            const count = this.journalEntries.length;
            this.journalSubHeader.text = `Discovered: ${count} / 4 Species · Camera: Logged`;
            
            let logText = '';
            for (let i = 0; i < this.journalEntries.length; i++) {
              const e = this.journalEntries[i];
              logText += `📸 [${e.time}] ${e.name}\n   Len: ${e.length} | Health: ${e.health} | Spd: ${e.speed}\n`;
            }
            this.journalListText.text = logText.trim();
          }

          const tip = document.getElementById('hud-xr-tip');
          if (tip && entry) {
            tip.textContent = `Captured: ${entry.name}!`;
          }
        }

        // ========================================================
