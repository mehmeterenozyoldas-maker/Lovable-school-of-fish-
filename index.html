        async toggleSpatialAnchors() {
          this.anchorsPinned = !this.anchorsPinned;
          audioEngine.playAnchorLock();

          const tip = document.getElementById('hud-xr-tip');
          const btn = document.getElementById('btn-anchor-toggle');

          if (this.anchorsPinned) {
            if (btn) btn.classList.add('active');
            if (tip) tip.textContent = 'Spatial Anchors: PINNED to Real Room';

            // Attempt WebXR native anchor creation
            if (xb.core.world && xb.core.world.anchors && xb.core.world.anchors.create) {
              try {
                if (this.spatialNaturalistCard) {
                  const p = this.spatialNaturalistCard.position;
                  const pose = new XRRigidTransform({ x: p.x, y: p.y, z: p.z }, { x: 0, y: 0, z: 0, w: 1 });
                  const tracked = await xb.core.world.anchors.create(pose, 'naturalist_card');
                  if (tracked) {
                    await xb.core.world.anchors.persist(tracked.id);
                    this.anchorRecords.push(tracked);
                  }
                }
              } catch (e) {
                console.warn('Native WebXR anchor note:', e);
              }
            }
          } else {
            if (btn) btn.classList.remove('active');
            if (tip) tip.textContent = 'Spatial Anchors: UNPINNED (Movable 6DoF)';
          }

          this.updateTelemetryCard();
          return this.anchorsPinned;
        }

        async restorePersistentAnchors() {
          if (xb.core.world && xb.core.world.anchors && xb.core.world.anchors.restoreAll) {
            try {
              const results = await xb.core.world.anchors.restoreAll();
              if (results && results.length > 0) {
                console.log('Restored WebXR spatial anchors:', results);
                this.anchorsPinned = true;
                const btn = document.getElementById('btn-anchor-toggle');
                if (btn) btn.classList.add('active');
              }
            } catch (e) {
              console.warn('Anchor restore note:', e);
            }
          }
        }

        setupFoodSystem() {
          this.foodGeo = new THREE.SphereGeometry(0.035, 12, 12);
          this.foodMat = new THREE.MeshStandardMaterial({
            color: 0xffd166,
            emissive: 0xff9f1c,
            emissiveIntensity: 0.8,
            roughness: 0.2
          });
        }

        spawnFoodPellet(pos, vel = null) {
          const mesh = new THREE.Mesh(this.foodGeo, this.foodMat);
          mesh.position.copy(pos);
          const velocity = vel ? vel.clone() : new THREE.Vector3(
            (Math.random() - 0.5) * 0.2,
            -0.45 - Math.random() * 0.2,
            (Math.random() - 0.5) * 0.2
          );
          this.add(mesh);
          this.foodPellets.push({
            mesh,
            pos: mesh.position,
            vel: velocity,
            life: 14.0
          });
          audioEngine.playFeedPellet();
        }

        onPointerDown(e) {
          if (e.target.closest && (e.target.closest('.hud-dock') || e.target.closest('.hud-header'))) {
            return;
          }
          if (this.ecologyMode === 'feed') {
            const cam = xb.core.camera;
            if (cam) {
              const forward = new THREE.Vector3(0, -0.1, -1.2).applyQuaternion(cam.quaternion);
              const dropPos = cam.position.clone().add(forward);
              this.spawnFoodPellet(dropPos);
            }
          } else if (this.ecologyMode === 'scatter') {
            audioEngine.playScatterWhoosh();
            if (xb.core.camera) {
              this.handPos.copy(xb.core.camera.position);
              this.handVelocity.set(0, 0, -5.0);
            }
          } else if (this.ecologyMode === 'attract') {
            audioEngine.playAttractTone();
          }
        }

        setBiome(biome) {
          this.currentBiome = biome;
          if (biome === 'sunlit') {
            this.ambientLight.color.setHex(0x0a3c5a);
            this.ambientLight.intensity = 2.5;
            this.sunLight.color.setHex(0xbde8ff);
            this.sunLight.intensity = 4.0;
            this.seabedMat.color.setHex(0x1b3b55);
            [this.matMackerel, this.matTang].forEach(m => {
              if (m && m.userData.shader) {
                m.userData.shader.uniforms.uCausticsStrength.value = 0.5;
                m.userData.shader.uniforms.uBiolumGlow.value = 0.0;
              }
            });
            if (this.godRays) this.godRays.setBrightness(1.0);
          } else if (biome === 'reef') {
            this.ambientLight.color.setHex(0x164e63);
            this.ambientLight.intensity = 2.8;
            this.sunLight.color.setHex(0x7dd3fc);
            this.sunLight.intensity = 3.5;
            this.seabedMat.color.setHex(0x0e7490);
            [this.matMackerel, this.matTang].forEach(m => {
              if (m && m.userData.shader) {
                m.userData.shader.uniforms.uCausticsStrength.value = 0.7;
                m.userData.shader.uniforms.uBiolumGlow.value = 0.2;
              }
            });
            if (this.godRays) this.godRays.setBrightness(0.75);
          } else if (biome === 'abyss') {
            this.ambientLight.color.setHex(0x020617);
            this.ambientLight.intensity = 0.7;
            this.sunLight.color.setHex(0x38bdf8);
            this.sunLight.intensity = 1.0;
            this.seabedMat.color.setHex(0x020617);
            [this.matMackerel, this.matTang].forEach(m => {
              if (m && m.userData.shader) {
                m.userData.shader.uniforms.uCausticsStrength.value = 0.15;
                m.userData.shader.uniforms.uBiolumGlow.value = 0.95;
              }
            });
            if (this.godRays) this.godRays.setBrightness(0.2);
          } else if (biome === 'night') {
            this.ambientLight.color.setHex(0x01040f);
            this.ambientLight.intensity = 0.4;
            this.sunLight.color.setHex(0x38bdf8);
            this.sunLight.intensity = 0.5;
            this.seabedMat.color.setHex(0x010614);
            [this.matMackerel, this.matTang].forEach(m => {
              if (m && m.userData.shader) {
                m.userData.shader.uniforms.uCausticsStrength.value = 0.05;
                m.userData.shader.uniforms.uBiolumGlow.value = 1.4;
              }
            });
            if (this.godRays) this.godRays.setBrightness(0.08);
          }
          audioEngine.playBubblePop(1.2);
          this.updateTelemetryCard();
        }

        setFishCount(count) {
          this.activeFishCount = Math.min(this.maxFish, Math.max(50, count));
          const mActive = Math.floor(this.activeFishCount * 0.6);
          const tActive = this.activeFishCount - mActive;

          for (let i = mActive; i < this.mackerelCount; i++) {
            this.dummy.position.set(0, -999, 0);
            this.dummy.scale.setScalar(0);
            this.dummy.updateMatrix();
            this.meshMackerel.setMatrixAt(i, this.dummy.matrix);
          }
          for (let i = tActive; i < this.tangCount; i++) {
            this.dummy.position.set(0, -999, 0);
            this.dummy.scale.setScalar(0);
            this.dummy.updateMatrix();
            this.meshTang.setMatrixAt(i, this.dummy.matrix);
          }
          this.meshMackerel.instanceMatrix.needsUpdate = true;
          this.meshTang.instanceMatrix.needsUpdate = true;
          this.updateTelemetryCard();
        }

        updateTelemetryCard() {
          if (this.aiTelemetryText) {
            this.aiTelemetryText.text = `Telemetry: ${this.activeFishCount} Fish · Speed: ${this.boidsParams.cruiseSpeed.toFixed(1)} m/s · Habitat: ${this.currentBiome} · Anchors: ${this.anchorsPinned ? 'Pinned' : 'Floating'}`;
          }
        }

        update() {
          const t = performance.now() * 0.001;
          const dt = 0.016;

          [this.matMackerel, this.matTang].forEach(m => {
            if (m && m.userData.shader) {
              m.userData.shader.uniforms.uTime.value = t;
            }
          });

          if (this.tabletopReefs) {
            this.tabletopReefs.update(t);
          }

          if (this.waterSurface) {
            this.waterSurface.update(t);
          }

          if (this.marineSnow) {
            this.marineSnow.update(t, dt);
          }

          if (this.shark) {
            this.shark.update(t, dt);
          }

          if (this.godRays) {
            this.godRays.update(t);
          }

          this.updateHandTracking(t);

          if (this.flashlight) {
            if (this.handActive) {
              this.flashlight.setPose(this.handPos);
            } else if (xb.core.camera) {
              const cam = xb.core.camera;
              const fwd = new THREE.Vector3(0.18, -0.15, -0.3).applyQuaternion(cam.quaternion);
              this.flashlight.setPose(cam.position.clone().add(fwd), cam.quaternion);
            }
          }

          this.updateBubbles(dt);
          this.updateFoodPellets(dt);
          this.updateBoids(t, dt);

          if (xb.core.camera) {
            const cam = xb.core.camera;
            const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
            audioEngine.updateListenerPose(cam.position, fwd, up);

            if (this.viewfinder) {
              this.updateViewfinderScanner(cam);
            }
          }
        }

        updateViewfinderScanner(cam) {
          if (!this.cameraModeActive || !this.viewfinder) return;

          const camPos = cam.position;
          const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          let bestCandidate = null;
          let bestScore = 0.86; // Minimum alignment dot product

          // 1. Check Shark Target
          if (this.shark) {
            const sharkPos = this.shark.headPos;
            const toShark = sharkPos.clone().sub(camPos);
            const dist = toShark.length();
            if (dist < 4.5) {
              const dot = toShark.normalize().dot(camDir);
              if (dot > bestScore) {
                bestScore = dot;
                bestCandidate = {
                  pos: sharkPos,
                  name: 'BLACKTIP REEF SHARK',
                  family: 'Carcharhinidae (Apex Predator)',
                  length: '1.42 m',
                  health: '99.4%',
                  speed: `${(this.shark.swimSpeed * 1.5).toFixed(1)} m/s`,
                  scale: 1.8
                };
              }
            }
          }

          // 2. Check Tabletop Coral Reefs
          const reefs = [
            { pos: new THREE.Vector3(-1.7, -0.55, -1.8), name: 'ACROPORA TABLETOP REEF' },
            { pos: new THREE.Vector3(1.7, -0.55, -1.8), name: 'PORITES CORAL FORMATION' }
          ];
          for (let r = 0; r < reefs.length; r++) {
            const toReef = reefs[r].pos.clone().sub(camPos);
            const dist = toReef.length();
            if (dist < 3.8) {
              const dot = toReef.normalize().dot(camDir);
              if (dot > bestScore) {
                bestScore = dot;
                bestCandidate = {
                  pos: reefs[r].pos,
                  name: reefs[r].name,
                  family: 'Scleractinia (Stony Coral)',
                  length: '1.20 m',
                  health: '98.1%',
                  speed: '0.0 m/s',
                  scale: 1.4
                };
              }
            }
          }

          // 3. Check Nearest Fish in active school
          const sampleCount = Math.min(80, this.activeFishCount);
          const fPos = new THREE.Vector3();
          for (let i = 0; i < sampleCount; i++) {
            fPos.set(this.positions[i * 3], this.positions[i * 3 + 1], this.positions[i * 3 + 2]);
            const toFish = fPos.clone().sub(camPos);
            const dist = toFish.length();
            if (dist < 3.2 && dist > 0.3) {
              const dot = toFish.normalize().dot(camDir);
              if (dot > bestScore) {
                bestScore = dot;
                const isMackerel = (i < Math.floor(this.activeFishCount * 0.6));
                bestCandidate = {
                  pos: fPos.clone(),
                  name: isMackerel ? 'ATLANTIC MACKEREL' : 'YELLOWTAIL CORAL TANG',
                  family: isMackerel ? 'Scombridae (Fast Pelagic)' : 'Acanthuridae (Reef Grazer)',
                  length: isMackerel ? '28.4 cm' : '19.2 cm',
                  health: `${(96.0 + Math.sin(i) * 3.5).toFixed(1)}%`,
                  speed: `${(this.speeds[i] || 1.8).toFixed(1)} m/s`,
                  scale: isMackerel ? 0.75 : 0.85
                };
              }
            }
          }

          if (bestCandidate) {
            this.viewfinder.lockTarget(bestCandidate);
          } else {
            this.viewfinder.clearTarget();
          }

          this.viewfinder.updatePose(camPos, cam.quaternion);
        }

        updateHandTracking(t) {
          this.handActive = false;

          // 1. Direct XR Hand Joints (Index, Thumb, Palm)
          if (xb.core.user && xb.core.user.hands && xb.core.user.hands.length > 0) {
            const hand = xb.core.user.hands[0];
            if (hand && hand.joints && hand.joints.length >= 10) {
              const indexTip = hand.joints[8];
              const thumbTip = hand.joints[4];

              if (indexTip && indexTip.position) {
                this.handVelocity.copy(indexTip.position).sub(this.lastHandPos).divideScalar(0.016);
                this.handPos.copy(indexTip.position);
                this.lastHandPos.copy(indexTip.position);
                this.handActive = true;
              }

              // Index to Thumb Pinch gesture for dynamic pellet flicking
              if (indexTip && thumbTip && indexTip.position && thumbTip.position) {
                const pinchDist = indexTip.position.distanceTo(thumbTip.position);
                if (pinchDist < 0.025 && !this.wasPinching) {
                  this.wasPinching = true;
                  if (this.ecologyMode === 'feed') {
                    const flickVel = this.handVelocity.clone().multiplyScalar(0.8);
                    this.spawnFoodPellet(indexTip.position.clone(), flickVel);
                  } else if (this.ecologyMode === 'camera') {
                    this.captureSpecimenSnapshot();
                  }
                } else if (pinchDist >= 0.035) {
                  this.wasPinching = false;
                }
              }

              // Palm Forward Wave Repulsion
              if (this.handVelocity.length() > 2.2) {
                audioEngine.playScatterWhoosh(this.handPos);
              }
            }
          }

          // 2. Two-Handed Biome Scaling Gesture (xb-add-interactions)
          if (xb.core.user && xb.core.user.hands && xb.core.user.hands.length >= 2) {
            const h0 = xb.core.user.hands[0];
            const h1 = xb.core.user.hands[1];
            if (h0.joints && h1.joints && h0.joints[8] && h1.joints[8] && h0.joints[4] && h1.joints[4]) {
              const p0 = h0.joints[8].position;
              const t0 = h0.joints[4].position;
              const p1 = h1.joints[8].position;
              const t1 = h1.joints[4].position;
              if (p0 && t0 && p1 && t1) {
                const pinch0 = p0.distanceTo(t0) < 0.035;
                const pinch1 = p1.distanceTo(t1) < 0.035;
                if (pinch0 && pinch1) {
                  const distHands = p0.distanceTo(p1);
                  if (this.lastTwoHandDist > 0) {
                    const delta = distHands - this.lastTwoHandDist;
                    const newScale = Math.max(0.35, Math.min(2.5, this.scale.x + delta * 1.8));
                    this.setBiomeScale(newScale);
                  }
                  this.lastTwoHandDist = distHands;
                } else {
                  this.lastTwoHandDist = 0;
                }
              }
            }
          } else {
            this.lastTwoHandDist = 0;
          }

          // 3. Controller Fallback
          if (!this.handActive && xb.core.input.controllers && xb.core.input.controllers.length > 0) {
            const ctrl = xb.core.input.controllers[0];
            if (ctrl && ctrl.position) {
              this.handPos.copy(ctrl.position);
              this.handActive = true;

              if (ctrl.userData && ctrl.userData.selected && !this.wasSelected) {
                this.wasSelected = true;
                if (this.ecologyMode === 'feed') {
                  this.spawnFoodPellet(ctrl.position.clone());
                } else if (this.ecologyMode === 'camera') {
                  this.captureSpecimenSnapshot();
                }
              } else if (ctrl.userData && !ctrl.userData.selected) {
                this.wasSelected = false;
              }
            }
          }
        }

        updateBubbles(dt) {
          if (!this.bubbleSystem) return;
          const pos = this.bubbleSystem.geometry.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            let y = pos.getY(i) + dt * 0.6;
            if (y > 3.0) y = -2.8;
            pos.setY(i, y);
            pos.setX(i, pos.getX(i) + Math.sin(y * 4.0) * 0.003);
          }
          pos.needsUpdate = true;
        }

        updateFoodPellets(dt) {
          for (let i = this.foodPellets.length - 1; i >= 0; i--) {
            const pellet = this.foodPellets[i];
            pellet.life -= dt;
            pellet.vel.y -= dt * 0.1;
            pellet.vel.multiplyScalar(0.98);
            pellet.pos.addScaledVector(pellet.vel, dt);

            if (pellet.pos.y < -2.6) {
              pellet.pos.y = -2.6;
              pellet.vel.set(0, 0, 0);
            }

            if (pellet.life <= 0) {
              this.remove(pellet.mesh);
              this.foodPellets.splice(i, 1);
            }
          }
        }

        updateBoids(t, dt) {
          const N = this.activeFishCount;
          const pos = this.positions;
          const vel = this.velocities;

          const schoolGoal = new THREE.Vector3(
            Math.sin(t * 0.25) * 4.2,
            -0.4 + Math.sin(t * 0.35) * 0.7,
            Math.cos(t * 0.2) * 3.8 - 1.5
          );

          const isAttracting = (this.ecologyMode === 'attract') || (this.handActive && this.ecologyMode === 'attract');
          const isScattering = (this.ecologyMode === 'scatter') || (this.handActive && this.handVelocity.length() > 2.0);

          const curPos = new THREE.Vector3();
          const curVel = new THREE.Vector3();
          const force = new THREE.Vector3();
          const diff = new THREE.Vector3();

          const { cruiseSpeed, cohesionWeight, separationWeight, avoidanceForce } = this.boidsParams;

          // Tabletop reef grazing centers
          const reefA = new THREE.Vector3(-1.7, -0.4, -1.8);
          const reefB = new THREE.Vector3(1.7, -0.4, -1.8);

          for (let i = 0; i < N; i++) {
            const i3 = i * 3;
            curPos.set(pos[i3], pos[i3 + 1], pos[i3 + 2]);
            curVel.set(vel[i3], vel[i3 + 1], vel[i3 + 2]);
            force.set(0, 0, 0);

            // 1. Primary Schooling & Alignment Flow
            diff.subVectors(schoolGoal, curPos);
            const distToGoal = diff.length();
            if (distToGoal > 0.01) {
              diff.normalize().multiplyScalar(cohesionWeight * 0.4);
              force.add(diff);
            }

            // 2. Neighbor Flocking (Separation & Velocity Match)
            const stride = 4;
            for (let j = (i + 1) % stride; j < N; j += stride) {
              if (i === j) continue;
              const j3 = j * 3;
              const dx = curPos.x - pos[j3];
              const dy = curPos.y - pos[j3 + 1];
              const dz = curPos.z - pos[j3 + 2];
              const distSq = dx * dx + dy * dy + dz * dz;

              if (distSq < 0.35 && distSq > 0.001) {
                const sepMag = ((0.35 - distSq) / 0.35) * separationWeight;
                force.x += (dx / Math.sqrt(distSq)) * sepMag;
                force.y += (dy / Math.sqrt(distSq)) * sepMag;
                force.z += (dz / Math.sqrt(distSq)) * sepMag;
              } else if (distSq < 2.2) {
                force.x += (vel[j3] - curVel.x) * 0.15;
                force.y += (vel[j3 + 1] - curVel.y) * 0.15;
                force.z += (vel[j3 + 2] - curVel.z) * 0.15;
              }
            }

            // 3. World Sensing: Tabletop Coral Reef Grazing
            const distToReefA = curPos.distanceTo(reefA);
            const distToReefB = curPos.distanceTo(reefB);
            const nearestReef = (distToReefA < distToReefB) ? reefA : reefB;
            const distToReef = Math.min(distToReefA, distToReefB);

            if (distToReef < 1.1) {
              const tangent = new THREE.Vector3(-(curPos.z - nearestReef.z), 0, (curPos.x - nearestReef.x)).normalize();
              force.addScaledVector(tangent, 0.7);
              force.y += (nearestReef.y + 0.1 - curPos.y) * 0.6;
            }

            // 4. World Sensing: Real Room Wall & Boundary Obstacle Avoidance
            const wallMargin = 0.5;
            if (curPos.x > 3.8 - wallMargin) force.x -= (curPos.x - (3.8 - wallMargin)) * 4.5;
            if (curPos.x < -3.8 + wallMargin) force.x += ((-3.8 + wallMargin) - curPos.x) * 4.5;
            if (curPos.z > 2.2 - wallMargin) force.z -= (curPos.z - (2.2 - wallMargin)) * 4.5;
            if (curPos.z < -4.2 + wallMargin) force.z += ((-4.2 + wallMargin) - curPos.z) * 4.5;
            if (curPos.y > 1.6 - wallMargin) force.y -= (curPos.y - (1.6 - wallMargin)) * 3.5;
            if (curPos.y < -2.2 + wallMargin) force.y += ((-2.2 + wallMargin) - curPos.y) * 4.5;

            // 5. Direct Hand Interaction: Avoidance / Scatter / Attract
            if (this.handActive) {
              const distToHand = curPos.distanceTo(this.handPos);
              if (isScattering && distToHand < 3.2) {
                diff.subVectors(curPos, this.handPos).normalize();
                const pushMag = Math.pow(1.0 - (distToHand / 3.2), 2.0) * avoidanceForce * 2.2;
                force.addScaledVector(diff, pushMag);
              } else if (isAttracting && distToHand < 4.5) {
                diff.subVectors(this.handPos, curPos);
                if (distToHand > 0.45) {
                  diff.normalize().multiplyScalar(1.6);
                  force.add(diff);
                } else {
                  const tangent = new THREE.Vector3(-diff.z, 0, diff.x).normalize().multiplyScalar(1.2);
                  force.add(tangent);
                }
              } else if (distToHand < 1.2) {
                diff.subVectors(curPos, this.handPos).normalize();
                force.addScaledVector(diff, avoidanceForce * (1.2 - distToHand));
              }
            }

            // 5B. Apex Predator (Shark) Flash-Expansion & Vacuole Evasion
            if (this.shark) {
              const distToShark = curPos.distanceTo(this.shark.headPos);
              if (distToShark < 2.2) {
                diff.subVectors(curPos, this.shark.headPos).normalize();
                const evadeMag = Math.pow(1.0 - (distToShark / 2.2), 2.0) * 8.5;
                force.addScaledVector(diff, evadeMag);

                // Vacuole maneuver: lateral split around shark heading
                const sharkForward = this.shark.velocity.clone().normalize();
                const sideNormal = new THREE.Vector3().crossVectors(sharkForward, new THREE.Vector3(0, 1, 0)).normalize();
                const sign = (diff.dot(sideNormal) >= 0) ? 1.0 : -1.0;
                force.addScaledVector(sideNormal, sign * 3.2);
              }
            }

            // 6. Food Pellet Hunting Behavior
            if (this.foodPellets.length > 0) {
              let nearestPellet = null;
              let nearestDist = 4.0;
              for (let f = 0; f < this.foodPellets.length; f++) {
                const p = this.foodPellets[f];
                const d = curPos.distanceTo(p.pos);
                if (d < nearestDist) {
                  nearestDist = d;
                  nearestPellet = p;
                }
              }

              if (nearestPellet) {
                diff.subVectors(nearestPellet.pos, curPos).normalize().multiplyScalar(2.8);
                force.add(diff);

                if (nearestDist < 0.14) {
                  nearestPellet.life = 0;
                  audioEngine.playBubblePop(1.5, curPos);
                }
              }
            }

            // Integrate Velocity & Position
            curVel.addScaledVector(force, dt);
            
            const currentSpeed = curVel.length();
            const maxSpd = isScattering ? (cruiseSpeed * 2.2) : (cruiseSpeed * 1.3);
            const minSpd = cruiseSpeed * 0.4;
            if (currentSpeed > maxSpd) {
              curVel.multiplyScalar(maxSpd / currentSpeed);
            } else if (currentSpeed < minSpd) {
              curVel.multiplyScalar(minSpd / Math.max(0.01, currentSpeed));
            }

            curPos.addScaledVector(curVel, dt);

            pos[i3] = curPos.x;
            pos[i3 + 1] = curPos.y;
            pos[i3 + 2] = curPos.z;
            vel[i3] = curVel.x;
            vel[i3 + 1] = curVel.y;
            vel[i3 + 2] = curVel.z;

            this.dummy.position.copy(curPos);
            const dir = curVel.clone().normalize();
            this.dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
            this.dummy.scale.setScalar(this.scales[i]);
            this.dummy.updateMatrix();

            if (i < this.mackerelCount) {
              this.meshMackerel.setMatrixAt(i, this.dummy.matrix);
            } else {
              this.meshTang.setMatrixAt(i - this.mackerelCount, this.dummy.matrix);
            }
          }

          this.meshMackerel.instanceMatrix.needsUpdate = true;
          this.meshTang.instanceMatrix.needsUpdate = true;
        }
      }

      // 8. Experience Manager (Pure Oceanic Ecosystem)
      // ==========================================
      class ExperienceManager extends xb.Script {
        constructor() {
          super();
          this.currentExperience = null;
        }

        init() {
          this.currentExperience = new OceanicEcosystem();
          this.add(this.currentExperience);
          xb.initScript(this.currentExperience);
        }
      }

      // ==========================================
      // 9. Global UI Action Bridge
      // ==========================================
      let expManagerInstance = null;

      window.setEcologyMode = (mode) => {
        if (expManagerInstance && expManagerInstance.currentExperience instanceof OceanicEcosystem) {
          expManagerInstance.currentExperience.ecologyMode = mode;
        }
        document.querySelectorAll('[id^="btn-mode-"]').forEach(el => el.classList.remove('active'));
        const btn = document.getElementById(`btn-mode-${mode}`);
        if (btn) btn.classList.add('active');

        const label = document.getElementById('active-mode-label');
        if (label) {
          label.textContent = `Mode: ${mode.charAt(0).toUpperCase() + mode.slice(1)}`;
        }
      };

      window.setBiome = (biome) => {
        if (expManagerInstance && expManagerInstance.currentExperience instanceof OceanicEcosystem) {
          expManagerInstance.currentExperience.setBiome(biome);
        }
        document.querySelectorAll('[id^="btn-biome-"]').forEach(el => el.classList.remove('active'));
        const btn = document.getElementById(`btn-biome-${biome}`);
        if (btn) btn.classList.add('active');
      };

      window.setFishDensity = (val) => {
        const count = parseInt(val, 10);
        const disp = document.getElementById('fish-count-display');
        if (disp) disp.textContent = count;
        if (expManagerInstance && expManagerInstance.currentExperience instanceof OceanicEcosystem) {
          expManagerInstance.currentExperience.setFishCount(count);
        }

        if (expManagerInstance && expManagerInstance.currentExperience instanceof OceanicEcosystem) {
          expManagerInstance.currentExperience.toggleSpatialAnchors();
        }
      };

      window.toggleDiveFlashlight = () => {
        if (expManagerInstance && expManagerInstance.currentExperience instanceof OceanicEcosystem) {
          const eco = expManagerInstance.currentExperience;
          if (eco.flashlight) {
            const on = eco.flashlight.toggle();
            const btn = document.getElementById('btn-flashlight-toggle');
            if (btn) {
              btn.classList.toggle('active', on);
              btn.style.color = on ? '#38bdf8' : '#64748b';
            }
          }
        }

      window.toggleVoiceNarration = () => {
        const isEnabled = naturalistVoice.toggle();
        const btn = document.getElementById('btn-voice-toggle');
        if (btn) {
          btn.classList.toggle('active-voice', isEnabled);
          btn.style.color = isEnabled ? '#c084fc' : '#64748b';
        }
      };

          btn.classList.toggle('active', !isMuted);
          btn.style.color = isMuted ? '#64748b' : '#38bdf8';

        if (naturalistMic) naturalistMic.toggle();
      };

      // Desktop keyboard shortcut 'C' for research photo shutter
      window.addEventListener('keydown', (e) => {
        if (e.key === 'c' || e.key === 'C') {
          window.capturePhoto();
        }
      });

      // Initialize xrblocks with Depth Occlusion & Spatial Anchors enabled
      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();

        // Enable Depth Sensing & Mesh Occlusion (xb-add-world-sensing)
        if (options.enableDepth) {
          options.enableDepth();
        }
        if (options.reticles) {
          options.reticles.projectOnDepthMesh = true;
        }

        // Enable Spatial Anchors & Persistence (xb-anchors)
        if (options.world && options.world.enableAnchors) {
          options.world.enableAnchors();
          if (options.world.enableAnchorPersistence) {
            options.world.enableAnchorPersistence();
          }
        }

        if (options.simulator && xb.SimulatorMode) {
          options.simulator.defaultMode = xb.SimulatorMode.USER;
        }

        expManagerInstance = new ExperienceManager();
        xb.add(expManagerInstance);
        xb.init(options);
      });
    </script>
  </body>
</html>
